<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>UTube Music — UI Preview</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#17191d;color:#f5f2eb;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic UI",sans-serif}button,input{font:inherit}button{cursor:pointer;color:inherit;border:0;background:none}button:focus-visible,input:focus-visible{outline:2px solid #ff644f;outline-offset:3px}body>main{max-width:900px;min-height:100vh;margin:auto;display:flex;align-items:center;justify-content:center;gap:58px;padding:30px 18px}aside{max-width:244px}aside small{color:#ff7966;font-size:11px;font-weight:700;letter-spacing:3px}aside h1{font-size:38px;letter-spacing:-1.7px;line-height:1.1;margin:18px 0}aside p{color:#a4a8b1;font-size:13px;line-height:1.9}aside hr{border:0;border-top:1px solid #35373c;margin:28px 0}aside .label{display:inline-block;background:#292c31;padding:8px 11px;border-radius:7px;font-size:11px}.phone{position:relative;width:390px;height:844px;flex:none;background:#0e0f12;border-radius:36px;overflow:hidden;box-shadow:0 26px 80px #0008;border:1px solid #3a3b40}.status{height:44px;padding:14px 23px 0;display:flex;justify-content:space-between;font-size:12px;font-weight:700}.status span:last-child{letter-spacing:2px}.content{position:absolute;inset:44px 0 145px;overflow:auto;scrollbar-width:none;padding:16px 22px 24px}.brand{font-size:22px;letter-spacing:-.8px;font-weight:750;display:flex;align-items:center;gap:9px;margin-bottom:26px}.mark{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:#ff644f;color:#111;font-size:20px}.spacer{flex:1}.icon{width:44px;height:44px;font-size:22px;display:inline-flex;align-items:center;justify-content:center;flex:none;line-height:1}.brand .icon{font-size:22px;width:34px}.hero{border-radius:22px;overflow:hidden;padding:25px;background:radial-gradient(ellipse at 110% -15%,#8a4b4440 0 37%,transparent 37.5% 43%,#ff644f12 43.5% 44%,transparent 44.5% 52%,#ff644f12 52.5% 53%,transparent 53.5%),linear-gradient(135deg,#462a2e,#1b1c21);margin-bottom:26px}.eyebrow{font-size:9px;letter-spacing:2px;color:#ff8a78;font-weight:750}.hero h2{font-size:30px;letter-spacing:-1px;line-height:1.45;margin:13px 0 9px}.hero p{font-size:11px;color:#bbb7b8;margin:0 0 20px}.pill{border-radius:30px;background:#f5f2eb;color:#111;padding:13px 22px;font-size:12px;font-weight:750;min-height:44px}.section{display:flex;align-items:center;justify-content:space-between;margin:25px 0 14px}.section h3{font-size:18px;letter-spacing:-.5px;margin:0}.section small{font-size:10px;color:#9da2ad}.cards{display:flex;gap:15px;overflow:auto;scrollbar-width:none}.card{text-align:left;width:143px;flex:none;padding:0}.card b{font-size:12px;display:block;margin-top:10px;line-height:1.5}.card small{font-size:10px;display:block;color:#a4a8b1;margin-top:4px}.art{position:relative;overflow:hidden;border-radius:11px;width:143px;height:143px;background:#234149;display:grid;place-items:center;color:#eee;font-weight:500;letter-spacing:3px;font-size:9px}.art:before{content:"";position:absolute;width:100px;height:100px;border-radius:50%;background:radial-gradient(circle,#eebb8800 0 10%,#efc7a8aa 11% 12%,#e6b78a00 13% 31%,#e1bda344 32% 33%,#e6b78a00 34% 43%,#e1bda344 44% 45%,#e6b78a00 46%),linear-gradient(120deg,#eca283,#23384f);transform:translate(28px,-15px)}.art span{z-index:1;align-self:end;margin-bottom:18px;text-shadow:0 2px 12px #000}.art.night{background:linear-gradient(150deg,#1b3b49,#181321)}.art.night:before{background:linear-gradient(150deg,#b78b88,#667881,#293b5c);border-radius:0;transform:rotate(-28deg) translate(40px,10px);height:210px;width:50px}.art.mist{background:linear-gradient(160deg,#899086,#294a49,#1c2e3e)}.art.mist:before{background:#b5cec559;filter:blur(16px);width:200px;height:90px;transform:rotate(-15deg)}.genres{display:grid;grid-template-columns:1fr 1fr;gap:11px}.genre{text-align:left;border-radius:13px;background:#4d323b;padding:17px;font-weight:650;font-size:14px;min-height:94px;display:flex;flex-direction:column;justify-content:space-between}.genre:nth-child(2){background:#303e60}.genre:nth-child(3){background:#304d45}.genre:nth-child(4){background:#50432f}.genre span{font-size:19px;opacity:.8}.bottom{position:absolute;bottom:0;left:0;right:0;padding:6px 8px 17px;background:linear-gradient(#0e0f12ed,#0e0f12 25%)}.mini{background:#292c32;border-radius:10px;position:relative;display:flex;align-items:center;gap:9px;padding:8px;height:62px;overflow:hidden}.mini:after{content:"";position:absolute;bottom:0;left:0;width:37%;height:2px;background:#ff7a65}.mini .art{width:42px;height:42px;border-radius:5px;flex:none}.mini .art:before{width:40px;height:40px}.mini-info{flex:1;min-width:0;text-align:left;padding:0}.mini-info b{display:block;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mini-info small{font-size:9px;display:block;color:#acb0b9;margin-top:5px}.mini .icon{font-size:19px;width:35px}.tabs{display:flex;justify-content:space-around;padding-top:7px}.tab{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:9px;color:#9da2ac;width:30%;min-height:49px}.tab i{font-style:normal;font-size:23px;line-height:29px}.tab.active{color:#f5f2eb}.home-indicator{position:absolute;bottom:6px;width:126px;height:4px;background:#eeeeeedd;border-radius:5px;left:calc(50% - 63px)}h2.page-title{font-size:29px;margin:7px 0 23px;letter-spacing:-1px}.searchbox{height:51px;border-radius:12px;background:#292c32;display:flex;align-items:center;padding:0 13px;gap:9px}.searchbox input{min-width:0;width:100%;background:transparent;border:0;color:#f5f2eb;font-size:12px;outline:none}.hint{font-size:10px;color:#9299a5;margin:13px 0 23px}.row{display:flex;align-items:center;gap:12px;min-height:77px}.row .art{width:54px;height:54px;flex:none;border-radius:7px}.row .art:before{width:50px;height:50px}.row .art span{font-size:5px;letter-spacing:1px;margin-bottom:5px}.row-info{flex:1;text-align:left;min-width:0;padding:0}.row-info b{display:block;font-size:12px;line-height:1.5}.row-info small{display:block;color:#a1a7b1;font-size:10px;margin-top:5px}.row .icon{font-size:22px;color:#b7bcc5}.chips{display:flex;gap:7px;margin-bottom:20px}.chip{border-radius:25px;background:#292c32;font-size:11px;padding:10px 15px;min-height:40px}.chip.active{background:#f5f2eb;color:#111}.heart-art{background:linear-gradient(135deg,#65409f,#1b5860);font-size:26px;letter-spacing:0}.heart-art:before{display:none}.playlist-art{background:linear-gradient(135deg,#cc6958,#563c60,#252633);font-size:30px}.playlist-art:before{background:transparent;border:12px solid #fff1;transform:translate(20px,-20px)}.player{position:absolute;inset:0;background:linear-gradient(145deg,#513c44,#13141a 60%,#0e0f12);padding:48px 24px 24px;overflow:auto}.player-head{display:flex;align-items:center;justify-content:space-between}.player-head small{font-size:9px;letter-spacing:2px;text-align:center}.player-head small span{display:block;color:#aaa3a9;font-size:9px;letter-spacing:0;margin-top:7px}.player .big-art{width:100%;height:330px;margin-top:26px;border-radius:14px;box-shadow:0 14px 40px #0003}.big-art:before{width:260px;height:260px}.big-art span{font-size:17px;letter-spacing:6px;margin-bottom:35px}.song-title{display:flex;align-items:center;margin-top:26px;gap:14px}.song-title div{flex:1}.song-title h2{font-size:25px;margin:0;letter-spacing:-.8px}.song-title p{font-size:12px;color:#b1adb4;margin:9px 0 0}.scrub{margin:24px 0 9px;height:3px;background:#ffffff26;border-radius:3px}.scrub:before{content:"";display:block;width:37%;height:3px;background:#f5f2eb}.times{display:flex;justify-content:space-between;font-size:10px;color:#b3acb4}.controls{display:flex;justify-content:space-between;align-items:center;margin-top:22px}.controls .play{background:#f5f2eb;color:#101114;border-radius:50%;width:73px;height:73px;font-size:26px}.player-foot{display:flex;align-items:center;justify-content:space-between;margin-top:24px;color:#a3a3ae;font-size:10px}.coral{color:#ff7a65!important}.overlay{position:absolute;inset:0;background:#0009;display:flex;align-items:flex-end;z-index:5}.sheet{background:#1b1d22;width:100%;padding:25px 24px 30px;border-radius:24px 24px 0 0}.handle{width:35px;height:4px;background:#555b65;border-radius:3px;margin:-13px auto 25px}.sheet h2{font-size:21px;margin:0 0 22px}.sheet p{font-size:11px;color:#a4a8b1;line-height:1.8}.sheet label{display:flex;align-items:center;justify-content:space-between;min-height:52px;font-size:13px}.sheet select{background:#292c32;border:0;color:#eee;padding:10px;border-radius:8px;font-size:12px}.sheet .pill{width:100%;margin-top:20px;background:#ff644f}.toast{position:absolute;top:48px;left:20px;right:20px;padding:14px;background:#343842;border-radius:12px;z-index:10;font-size:12px;box-shadow:0 8px 25px #0005}@media(max-width:740px){body>main{gap:0;padding:16px 8px}aside{display:none}}@media(max-width:410px){.phone{width:100%;border-radius:20px}.content{padding-left:18px;padding-right:18px}}
#layer{position:absolute;inset:0;pointer-events:none;z-index:5}#layer>*{pointer-events:auto}
@media(min-width:741px) and (max-height:900px){.phone{zoom:.75}body>main{padding:20px 18px}}
</style>
<main><aside><small>UTUBE MUSIC / 01</small><h1>Your music.<br>Your space.</h1><p>曲を探すところから、<br>オフラインで聴くところまで。<br>ひとつのアプリで。</p><hr><span class="label">UI確認用・サンプルデータ</span><p>下部タブ、曲の保存、ミニプレイヤーを操作できます。音声の再生・取得は行わないデザインプレビューです。</p><p>iPhoneアプリ本体はSwiftUIで実装中。実機の画面とは細部が異なります。</p></aside><div class="phone"><div class="status"><span>9:41</span><span>▮▮ ◒ ▰</span></div><div class="content" id="content"></div><div class="bottom" id="bottom"></div><div class="home-indicator"></div><div id="layer"></div></div></main>
<script>
const tracks=[{title:'After the Rain',artist:'Harbor Lights',art:'',album:'AFTER THE RAIN'},{title:'Midnight Drive',artist:'Blue Hour',art:'night',album:'BLUE HOUR'},{title:'A Quiet Place',artist:'Stillwater',art:'mist',album:'STILLWATER'}];
let page='home',playing=false,favorite=false;const $=s=>document.querySelector(s);const art=(s,extra='')=>`<div class="art ${s.art} ${extra}"><span>${s.album}</span></div>`;
const icon=(s,label,action,cls='')=>`<button class="icon ${cls}" aria-label="${label}" onclick="${action}">${s}</button>`;
function toast(text){$('#layer').innerHTML=`<div class="toast" role="status">${text}</div>`;setTimeout(()=>$('#layer').innerHTML='',2300)}
function nav(p){page=p;$('#layer').innerHTML='';render()}
function row(s,i,saved=false){return `<div class="row">${art(s)}<button class="row-info" onclick="${saved?'openPlayer()':'save('+i+')'}"><b>${s.title}</b><small>${s.artist} · ${i===0?'3:42':i===1?'4:08':'2:56'}</small></button>${icon(saved?'···':'↓',saved?'曲のメニュー':'曲を保存',saved?'menu('+i+')':'save('+i+')')}</div>`}
function render(){
let c='';if(page==='home'){c=`<div class="brand"><span class="mark">≋</span>UTube Music<span class="spacer"></span>${icon('↓','保存状況',"downloads()")}${icon('⚙','設定',"toast('設定：保存容量・読み込み・バックアップ')")}</div><div class="hero"><div class="eyebrow">YOUR MUSIC, YOUR SPACE</div><h2>好きな曲を、<br>いつもそばに。</h2><p>見つけて、保存して、そのまま聴こう。</p><button class="pill" onclick="nav('search')">⌕ &nbsp; 曲を探す</button></div><div class="section"><h3>最近保存した曲</h3><small>オフライン再生</small></div><div class="cards">${tracks.map(s=>`<button class="card" onclick="openPlayer()">${art(s)}<b>${s.title}</b><small>${s.artist}</small></button>`).join('')}</div><div class="section"><h3>今の気分から探す</h3></div><div class="genres">${['J-POP','Chill','Jazz','ピアノ'].map((x,i)=>`<button class="genre" onclick="nav('search')"><span>${['✧','☾','♬','♩'][i]}</span>${x}</button>`).join('')}</div>`}
if(page==='search'){c=`<h2 class="page-title">検索</h2><form onsubmit="event.preventDefault();toast('検索結果の表示サンプルです')"><div class="searchbox"><span>⌕</span><input aria-label="曲を検索" placeholder="曲名、アーティスト、YouTubeリンク"><button aria-label="検索">→</button></div></form><p class="hint">YouTubeで曲を検索</p><div class="section"><h3>曲を見つける</h3><small>表示サンプル</small></div>${tracks.map((s,i)=>row(s,i)).join('')}<div class="section"><h3>気分に合わせて</h3></div><div class="genres"><button class="genre" onclick="toast('Chillを検索')"><span>☾</span>Chill</button><button class="genre" onclick="toast('Jazzを検索')"><span>♬</span>Jazz</button></div>`}
if(page==='library'){c=`<div style="display:flex;align-items:center;justify-content:space-between"><h2 class="page-title">ライブラリ</h2>${icon('+','プレイリストを作成',"toast('プレイリスト名を入力する画面へ')")}</div><div class="chips"><button class="chip active" onclick="nav('library')">すべて</button><button class="chip" onclick="toast('お気に入りの曲を表示')">お気に入り</button><button class="chip" onclick="playlist()">プレイリスト</button></div><div class="row"><div class="art heart-art" style="width:62px;height:62px">♥</div><button class="row-info" onclick="playlist(true)"><b>お気に入りの曲</b><small>3曲</small></button><span>›</span></div><div class="row"><div class="art playlist-art" style="width:62px;height:62px">≋</div><button class="row-info" onclick="playlist()"><b>夜の散歩</b><small>プレイリスト · 3曲</small></button><span>›</span></div><div class="section"><h3>保存した曲</h3><small>3曲</small></div>${tracks.map((s,i)=>row(s,i,true)).join('')}`}
$('#content').innerHTML=c;$('#content').scrollTop=0;bottom();}
function bottom(){$('#bottom').style.display='block';$('#bottom').innerHTML=`<div class="mini">${art(tracks[0])}<button class="mini-info" onclick="openPlayer()"><b>After the Rain</b><small>Harbor Lights</small></button>${icon(favorite?'♥':'♡','お気に入り',"toggleFavorite()",favorite?'coral':'')}${icon(playing?'Ⅱ':'▶','再生操作のデモ',"togglePlay()")}</div><nav class="tabs">${[['home','⌂','ホーム'],['search','⌕','検索'],['library','▥','ライブラリ']].map(([p,i,t])=>`<button class="tab ${page===p?'active':''}" onclick="nav('${p}')"><i>${i}</i>${t}</button>`).join('')}</nav>`}
function toggleFavorite(){favorite=!favorite;if($('#layer .player'))openPlayer();else bottom()}
function togglePlay(){playing=!playing;if($('#layer .player'))openPlayer();else bottom()}
function openPlayer(){$('#layer').innerHTML=`<div class="player"><div class="player-head">${icon('⌄','閉じる',"closeLayer() ")}<small>NOW PLAYING<span>このiPhoneのライブラリ</span></small>${icon('···','曲のメニュー',"menu(0)")}</div>${art(tracks[0],'big-art')}<div class="song-title"><div><h2>After the Rain</h2><p>Harbor Lights</p></div>${icon(favorite?'♥':'♡','お気に入り',"toggleFavorite()",favorite?'coral':'')}</div><div class="scrub"></div><div class="times"><span>1:23</span><span>3:42</span></div><div class="controls">${icon('⤨','シャッフル',"this.classList.toggle('coral')")}${icon('◀','前の曲',"this.blur()")}${icon(playing?'Ⅱ':'▶','再生操作のデモ',"togglePlay()",'play')}${icon('▶','次の曲',"this.blur()")}${icon('↻','リピート',"this.classList.toggle('coral')")}</div><div class="player-foot"><span>✓ &nbsp; オフラインで再生</span>${icon('☷','再生キュー',"queue()")}</div></div>`}
function closeLayer(){$('#layer').innerHTML=''}
function save(i){$('#layer').innerHTML=`<div class="overlay"><div class="sheet"><div class="handle"></div><h2>曲を保存</h2><div class="row">${art(tracks[i])}<div class="row-info"><b>${tracks[i].title}</b><small>${tracks[i].artist}</small></div>${icon('×','閉じる',"closeLayer()")}</div><label>♡ お気に入りに追加<input type="checkbox"></label><label>プレイリスト<select aria-label="保存先"><option>ライブラリのみ</option><option>夜の散歩</option></select></label><p>AAC / M4A · 保存後はオフライン再生<br>保存が終わるまでアプリを開いてください。</p><button class="pill" onclick="toast('保存操作のデモです。音声の取得は行いません。')">↓ &nbsp; 曲を保存</button></div></div>`}
function menu(i){$('#layer').innerHTML=`<div class="overlay"><div class="sheet"><div class="handle"></div><h2>${tracks[i].title}</h2><label><button onclick="toggleFavorite();closeLayer()">♡ お気に入りに追加</button></label><label><button onclick="toast('プレイリストを選択')">＋ プレイリストに追加</button></label><label><button onclick="toast('キューに追加しました（デモ）')">☷ 再生キューに追加</button></label><label><button class="coral" onclick="toast('削除の確認画面へ（デモ）')">ライブラリから削除</button></label><button class="pill" onclick="closeLayer()">閉じる</button></div></div>`}
function playlist(fav=false){$('#content').innerHTML=`<button onclick="nav('library')" style="min-height:44px">‹ ライブラリ</button><div class="art ${fav?'heart-art':'playlist-art'}" style="width:210px;height:210px;margin:15px auto 28px;font-size:60px">${fav?'♥':'≋'}</div><h2 class="page-title">${fav?'お気に入りの曲':'夜の散歩'}</h2><p class="hint">3曲 · 10分46秒 · オフライン</p><div style="display:flex;align-items:center;gap:18px"><button class="pill" style="background:#ff644f;flex:1" onclick="openPlayer()">▶ &nbsp; 再生</button>${icon('⤨','シャッフル再生',"openPlayer()",'coral')}</div>${tracks.map((s,i)=>row(s,i,true)).join('')}`;$('#content').scrollTop=0}
function queue(){$('#layer').innerHTML=`<div class="overlay"><div class="sheet"><div class="handle"></div><h2>再生キュー</h2><p>次に再生</p>${tracks.slice(1).map((s,i)=>row(s,i+1,true)).join('')}<button class="pill" onclick="openPlayer()">再生画面へ戻る</button></div></div>`}
function downloads(){$('#layer').innerHTML=`<div class="overlay"><div class="sheet"><div class="handle"></div><h2>保存の状況</h2><p>保存の進行状況・キャンセル・再試行をここに表示します。</p><button class="pill" onclick="closeLayer()">閉じる</button></div></div>`}
render();
</script></html>
