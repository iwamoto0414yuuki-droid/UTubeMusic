name: Build personal iPhone app (free standard runner)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: utubemusic-personal-build
  cancel-in-progress: false
jobs:
  build:
    # Fail closed: never run this macOS job against a private repository's paid allowance.
    if: github.event.repository.private == false
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install project generator
        run: brew install xcodegen
      - name: Prepare pinned Python and generate project
        run: |
          python3 scripts/prepare.py
          xcodegen generate
      - name: Run offline extractor contract tests
        run: python3 -m unittest discover -s tests_python -v
      - name: Choose available iPhone simulator
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          devices = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '-j']))['devices']
          phones = [d for runtime, group in devices.items() if 'iOS' in runtime for d in group if d.get('isAvailable') and 'iPhone' in d['name']]
          if not phones:
              raise SystemExit('No iPhone simulator installed; do not skip native tests')
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('SIMULATOR_ID=' + phones[0]['udid'] + '\n')
          PY
      - name: Boot iPhone simulator
        timeout-minutes: 5
        run: xcrun simctl bootstatus "$SIMULATOR_ID" -b
      - name: Native build and queue/library tests
        timeout-minutes: 15
        run: |
          set -euo pipefail
          xcodebuild -project UTubeMusic.xcodeproj -scheme UTubeMusic -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -derivedDataPath build/simulator \
            -parallel-testing-enabled NO -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 60 -maximum-test-execution-time-allowance 120 \
            CODE_SIGNING_ALLOWED=NO test 2>&1 | tee build/native-tests.log
      - name: Export native screen attachments
        run: |
          RESULT_BUNDLE=$(find build/simulator/Logs/Test -maxdepth 1 -name '*.xcresult' -print -quit)
          xcrun xcresulttool export attachments --path "$RESULT_BUNDLE" --output-path build/screenshots
          python3 scripts/collect_screenshots.py
      - name: Build SideStore IPA
        run: bash scripts/build_ipa.sh
      - uses: actions/upload-artifact@v4
        with:
          name: UTubeMusic-0.3.0-SideStore
          path: |
            build/UTubeMusic-0.3.0-unsigned.ipa
            build/UTubeMusic-0.3.0-unsigned.ipa.sha256
            build/native-*.png
            build/native-tests.log
          retention-days: 1
          if-no-files-found: error
      - name: Build logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: build/*.log
          retention-days: 1
