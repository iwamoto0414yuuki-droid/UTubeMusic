name: UTubeMusic
options:
  bundleIdPrefix: local.utubemusic
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGNING_ALLOWED: NO
    MARKETING_VERSION: '0.2.3'
    CURRENT_PROJECT_VERSION: '5'
    CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: NO
targets:
  UTubeMusic:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: build/Info.plist
      properties:
        CFBundleDisplayName: UTube Music
        CFBundleShortVersionString: '0.2.3'
        CFBundleVersion: '5'
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLName: local.utubemusic.add
            CFBundleURLSchemes: [utubemusic]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.utubemusic.player
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: Sources/PythonBridge.h
        OTHER_LDFLAGS: ['$(inherited)', '-framework', 'WebKit']
    dependencies:
      - framework: vendor/Python.xcframework
        embed: true
      - sdk: AVFoundation.framework
      - sdk: MediaPlayer.framework
      - sdk: WebKit.framework
    postBuildScripts:
      - name: Embed Python and native modules
        script: python3 "$PROJECT_DIR/scripts/embed_python.py"
        basedOnDependencyAnalysis: false
  UTubeMusicTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: UTubeMusic
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  UTubeMusic:
    build:
      targets:
        UTubeMusic: all
    test:
      targets: [UTubeMusicTests]

